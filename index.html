<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2F6F6D">
<title>Isla de las Emociones</title>
<meta name="description" content="Diario de emociones sincronizado con Google Sheets: registra, aprende e identifica emociones desde cualquier dispositivo.">
<style>
  :root{
    color-scheme: light;
    --bg:#FFFCF6; --surface:#FFFFFF; --surface-2:#EFF6F2;
    --ink:#293B3A; --ink-soft:#5B6E6B; --line:#DCE8E1;
    --accent:#2F6F6D; --accent-ink:#1E4E4C;
    --amber:#F2C85B; --amber-ink:#8A6A12;
    --sand:#F1E4C8; --sage:#A8C99A; --coral:#E9A18A;
    --sky:#4a97c9; --danger:#C9543F;
    --shadow: 0 6px 0 rgba(41,59,58,.07), 0 12px 30px rgba(41,59,58,.10);
    --radius:18px;
    --font-display:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
    --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono:"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    color-scheme: dark;
    --bg:#141b1a; --surface:#1d2726; --surface-2:#26312f;
    --ink:#e9f1ee; --ink-soft:#9db1ac; --line:#33403d;
    --accent:#5aada9; --accent-ink:#bfe7e3;
    --amber:#F2C85B; --amber-ink:#F2C85B;
    --sand:#e6d5ad; --sage:#A8C99A; --coral:#E9A18A;
    --sky:#6cb6e6; --danger:#e8785f;
    --shadow: 0 6px 0 rgba(0,0,0,.25), 0 12px 30px rgba(0,0,0,.45);
  }}
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#141b1a; --surface:#1d2726; --surface-2:#26312f;
    --ink:#e9f1ee; --ink-soft:#9db1ac; --line:#33403d;
    --accent:#5aada9; --accent-ink:#bfe7e3;
    --amber:#F2C85B; --amber-ink:#F2C85B;
    --sand:#e6d5ad; --sage:#A8C99A; --coral:#E9A18A;
    --sky:#6cb6e6; --danger:#e8785f;
    --shadow: 0 6px 0 rgba(0,0,0,.25), 0 12px 30px rgba(0,0,0,.45);
  }
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;}
  *{box-sizing:border-box;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  .app{max-width:560px;margin:0 auto;padding:16px;padding-block:16px 96px;min-height:100%;}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:19px;font-weight:600;}
  .logo .mark{width:38px;height:38px;object-fit:contain;display:block;}
  .spacer{flex:1;}
  .points-pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:2px solid var(--line);padding:6px 12px;border-radius:999px;font-family:var(--font-mono);font-weight:700;color:var(--amber-ink);box-shadow:var(--shadow);}
  .icon-btn{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:18px;display:grid;place-items:center;box-shadow:var(--shadow);}
  .greeting{margin:4px 2px 16px;}
  .greeting h1{font-size:26px;}
  .greeting p{margin:4px 0 0;color:var(--ink-soft);}
  .mode-card{width:100%;text-align:left;border:none;border-radius:var(--radius);padding:20px;margin-bottom:14px;color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;transition:transform .12s ease;}
  .mode-card:active{transform:translateY(2px);}
  .mode-card .emoji{font-size:40px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));}
  .mode-card h2{font-size:20px;margin-bottom:2px;}
  .mode-card p{margin:0;opacity:.92;font-size:14px;line-height:1.35;}
  .mode-1{background:linear-gradient(135deg,#2F6F6D,#3E8A87);}
  .mode-2{background:linear-gradient(135deg,#6E9A70,#86B383);}
  .mode-3{background:linear-gradient(135deg,#E29070,#E9A18A);}
  .mode-card::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;background:rgba(255,255,255,.12);border-radius:24px;transform:rotate(25deg);}
  .home-strip{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
  .stat{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
  .stat .n{font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--accent);}
  .stat .l{font-size:13px;color:var(--ink-soft);}
  .collection{margin-top:16px;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .collection h3{font-size:16px;margin-bottom:10px;}
  .isle{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .tile{aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;border:2px dashed var(--line);color:var(--ink-soft);}
  .tile.on{border-style:solid;border-color:var(--accent);background:rgba(47,111,109,.12);}
  .step{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .progress{display:flex;gap:6px;margin-bottom:16px;}
  .progress span{height:6px;flex:1;border-radius:6px;background:var(--line);}
  .progress span.on{background:var(--accent);}
  .step .q{font-size:22px;margin-bottom:4px;}
  .step .hint{color:var(--ink-soft);font-size:14px;margin:0 0 16px;}
  textarea,input[type=text],input[type=password],input[type=url],select{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);padding:12px;font-family:inherit;font-size:16px;resize:vertical;}
  textarea:focus,input:focus,select:focus{outline:3px solid rgba(47,111,109,.35);border-color:var(--accent);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .chip{border:2px solid var(--line);background:var(--surface-2);color:var(--ink);padding:9px 13px;border-radius:999px;font-size:14px;}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .emo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
  .emo{border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);transition:transform .1s ease;}
  .emo:active{transform:scale(.96);}
  .emo .face{font-size:34px;}
  .emo .name{font-size:13px;font-weight:600;text-align:center;}
  .emo.sel{border-color:var(--accent);background:rgba(47,111,109,.14);box-shadow:0 0 0 3px rgba(47,111,109,.25);}
  .scale{display:flex;gap:8px;margin-top:8px;}
  .scale button{flex:1;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);font-size:24px;color:var(--ink);}
  .scale button.sel{border-color:var(--amber);background:rgba(242,200,91,.16);}
  .scale-labels{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:12px;margin-top:6px;}
  .row{display:flex;gap:10px;margin-top:18px;}
  .btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;font-family:var(--font-display);box-shadow:var(--shadow);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:2px solid var(--line);box-shadow:none;}
  .btn-sm{flex:0 0 auto;padding:9px 14px;font-size:14px;border-radius:11px;}
  .btn-primary:disabled{opacity:.45;box-shadow:none;}
  .celebrate{text-align:center;padding:34px 20px;}
  .celebrate .big{font-size:70px;line-height:1;}
  .celebrate h2{font-size:26px;margin:14px 0 6px;}
  .celebrate p{color:var(--ink-soft);margin:0 0 8px;}
  .reward{display:inline-flex;align-items:center;gap:8px;background:rgba(242,200,91,.20);color:var(--amber-ink);font-family:var(--font-mono);font-weight:700;padding:8px 16px;border-radius:999px;margin-top:6px;}
  .parent-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .parent-head h1{font-size:22px;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--surface-2);padding:6px;border-radius:14px;overflow-x:auto;}
  .tabs button{flex:0 0 auto;border:none;background:transparent;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--ink-soft);font-family:var(--font-display);white-space:nowrap;}
  .tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .entry{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
  .entry .when{font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);}
  .entry .emos{margin:6px 0;font-size:15px;font-weight:600;}
  .entry .det{margin:2px 0;font-size:14px;}
  .entry .meta{font-size:13px;color:var(--ink-soft);}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(242,200,91,.22);color:var(--amber-ink);font-family:var(--font-mono);}
  .report{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .report h2{font-size:19px;margin-bottom:2px;}
  .report .sub{color:var(--ink-soft);font-size:13px;margin-bottom:14px;}
  .sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .sumgrid .box{background:var(--surface-2);border-radius:12px;padding:12px;text-align:center;}
  .sumgrid .box .n{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--accent);}
  .sumgrid .box .l{font-size:12px;color:var(--ink-soft);}
  .bar-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px;}
  .bar-row .lbl{width:110px;flex-shrink:0;}
  .bar-track{flex:1;height:14px;background:var(--surface-2);border-radius:8px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:8px;}
  .bar-row .val{width:26px;text-align:right;font-family:var(--font-mono);color:var(--ink-soft);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-weight:600;margin-bottom:6px;font-size:14px;}
  .note{font-size:13px;color:var(--ink-soft);}
  .callout{background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--ink-soft);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:all .25s ease;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:18px auto;}
  .pin-pad button{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:26px;font-family:var(--font-mono);color:var(--ink);box-shadow:var(--shadow);}
  .pin-dots{display:flex;gap:14px;justify-content:center;margin-top:10px;}
  .pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-soft);}
  .pin-dots span.on{background:var(--accent);border-color:var(--accent);}
  .mgr-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);}
  .mgr-item .face{font-size:26px;}
  .mgr-item .body{flex:1;min-width:0;}
  .mgr-item .body .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mgr-item .body .s{font-size:12px;color:var(--ink-soft);}
  .mini{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-size:16px;display:grid;place-items:center;flex:0 0 auto;}
  .mini.danger{color:var(--danger);}
  .emoji-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:180px;overflow-y:auto;background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:8px;margin-top:8px;}
  .emoji-picker button{border:none;background:transparent;font-size:24px;padding:4px;border-radius:8px;}
  .emoji-picker button.sel{background:rgba(47,111,109,.2);}
  .lesson-view img{max-width:100%;border-radius:12px;border:2px solid var(--line);}
  .pdfframe{width:100%;height:70vh;border:2px solid var(--line);border-radius:10px;background:#fff;margin-top:10px;}
  .quiz-q{background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .quiz-q .qt{font-weight:600;margin-bottom:10px;}
  .quiz-q img{max-width:100%;border-radius:10px;border:2px solid var(--line);margin:4px 0 10px;}
  .opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px;margin-bottom:8px;font-size:15px;}
  .opt.sel{border-color:var(--sky);background:rgba(74,151,201,.12);}
  .opt.ok{border-color:var(--accent);background:rgba(47,111,109,.16);}
  .opt.no{border-color:var(--danger);background:rgba(201,84,63,.14);}
  .center-screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;}
  .spinner{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .footer-hint{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:22px;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
  @media(min-width:520px){.emo-grid{grid-template-columns:repeat(4,1fr);}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<body>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===========================================================
   Isla de las Emociones — versión SINCRONIZADA (Google Sheets)
   Los datos viven en tu hoja; todos los dispositivos comparten.
   Archivos de lecciones: enlaces de Google Drive.
   =========================================================== */

const CUERPO = [
  {id:'tripa',label:'Nudo en la tripa',face:'🌀'},{id:'cara',label:'Calor en la cara',face:'🔥'},
  {id:'llorar',label:'Ganas de llorar',face:'💧'},{id:'corazon',label:'Corazón acelerado',face:'💓'},
  {id:'tenso',label:'Cuerpo tenso',face:'⚡'},{id:'cansado',label:'Cansancio',face:'🪫'},
  {id:'temblor',label:'Temblor',face:'🥶'},{id:'nada',label:'Nada especial',face:'🫧'}
];
const DETONANTES = ['En el cole','Con un amigo/a','En casa','Deberes','Deporte','Redes/móvil','Familia','Sin saber por qué'];
const ISLA_ITEMS = ['🌱','🌳','🏠','🌸','⛺','🐢','🦜','🌊','⛵','🗿','🏝️','🌈'];
const DEFAULT_EMOS = [
  {id:'alegria',name:'Alegría',face:'😄'},{id:'tristeza',name:'Tristeza',face:'😢'},
  {id:'enfado',name:'Enfado',face:'😠'},{id:'miedo',name:'Miedo',face:'😨'},
  {id:'sorpresa',name:'Sorpresa',face:'😲'},{id:'asco',name:'Asco',face:'🤢'},
  {id:'calma',name:'Calma',face:'😌'},{id:'nervios',name:'Nervios',face:'😰'},
  {id:'verguenza',name:'Vergüenza',face:'😳'},{id:'orgullo',name:'Orgullo',face:'😎'},
  {id:'frustracion',name:'Frustración',face:'😤'},{id:'soledad',name:'Soledad',face:'🥺'}
];
const EMOJI_PALETTE = "😄 😆 😊 🙂 😌 😐 😕 🙁 😢 😭 😠 😡 😤 😨 😰 😱 😳 😬 😶 🤢 🤮 🥺 🥹 😎 🤩 🥳 😴 🤯 😵 😞 😔 😟 😮 😲 🤔 🙄 😏 🫥 🤗 🥰 😍 😅 😇 🤨 😪 ❤️ 💔 ⚡ 🔥 🌈 ☁️ ⛈️ 💧 💓 🌀".split(" ");
const MONEY_PER_ISLA=100;

/* ---------- conexión ---------- */
let API = ''; try{ API=localStorage.getItem('isla_api')||''; }catch(e){}
let state = defaultState();
function defaultState(){ return {nombre:'',pin:'',money:0,moneyEarned:0,lastDay:'',lastDiaryDay:'',streak:0,rates:{registro:20,racha:10,lectura:15,acierto:5,diario:20},payments:[],learnDone:{},entries:[],emociones:DEFAULT_EMOS.map(e=>({...e})),lessons:[],diario:[],notas:[]}; }
function normalize(s){ const d=defaultState(); s=s||{};
  return {nombre:s.nombre||'',pin:s.pin||'',money:+s.money||0,moneyEarned:+s.moneyEarned||0,lastDay:s.lastDay||'',lastDiaryDay:s.lastDiaryDay||'',streak:+s.streak||0,
    rates:Object.assign({...d.rates},s.rates||{}),payments:Array.isArray(s.payments)?s.payments:[],learnDone:s.learnDone||{},
    entries:Array.isArray(s.entries)?s.entries:[],emociones:(Array.isArray(s.emociones)&&s.emociones.length)?s.emociones:d.emociones,
    lessons:Array.isArray(s.lessons)?s.lessons:[],diario:Array.isArray(s.diario)?s.diario:[],notas:Array.isArray(s.notas)?s.notas:[]}; }

async function api(action,data){
  if(action==='load'){ const r=await fetch(API+(API.indexOf('?')>=0?'&':'?')+'action=load&t='+Date.now()); const j=await r.json(); if(!j.ok)throw new Error(j.error||'error'); return j.state; }
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data})});
  const j=await r.json(); if(!j.ok)throw new Error(j.error||'error'); return j;
}
function cacheState(){ try{ localStorage.setItem('isla_cache',JSON.stringify(state)); }catch(e){} }
function cfgFields(){ return {nombre:state.nombre,pin:state.pin,money:state.money,moneyEarned:state.moneyEarned,lastDay:state.lastDay,lastDiaryDay:state.lastDiaryDay,streak:state.streak,rates:state.rates,payments:state.payments,learnDone:state.learnDone}; }
async function pushConfig(){ cacheState(); try{ await api('saveConfig',cfgFields()); }catch(e){ toast('Sin conexión: no se sincronizó'); } }
async function pushEmociones(){ cacheState(); try{ await api('saveEmociones',state.emociones); }catch(e){ toast('Sin conexión: no se sincronizó'); } }
async function pushLecciones(){ cacheState(); try{ await api('saveLecciones',state.lessons); }catch(e){ toast('Sin conexión: no se sincronizó'); } }
async function pushDiario(entry){ cacheState(); try{ await api('saveDiario',entry); }catch(e){ toast('Sin conexión: no se sincronizó'); } }
async function pushNotas(){ cacheState(); try{ await api('saveNotas',state.notas); }catch(e){ toast('Sin conexión: no se sincronizó'); } }
async function pushRegistro(entry){ cacheState(); try{ await api('saveRegistro',entry); }catch(e){ outboxAdd(entry); toast('Guardado sin conexión; se enviará al volver internet'); } }
function outboxAdd(entry){ try{ const o=JSON.parse(localStorage.getItem('isla_outbox')||'[]'); o.push(entry); localStorage.setItem('isla_outbox',JSON.stringify(o)); }catch(e){} }
async function outboxFlush(){ let o=[]; try{ o=JSON.parse(localStorage.getItem('isla_outbox')||'[]'); }catch(e){} if(!o.length)return;
  const rest=[]; for(const en of o){ try{ await api('saveRegistro',en); }catch(e){ rest.push(en); } }
  try{ localStorage.setItem('isla_outbox',JSON.stringify(rest)); }catch(e){} }

/* ---------- utilidades ---------- */
function emoList(){ return state.emociones; }
function emoMap(){ return Object.fromEntries(state.emociones.map(e=>[e.id,e])); }
function emoName(id){ const m=emoMap(); return m[id]?(m[id].face+' '+m[id].name):id; }
function todayKey(d=new Date()){ return d.toISOString().slice(0,10); }
function fmtDateTime(iso){ const d=new Date(iso); return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function unlockedCount(){ return Math.min(ISLA_ITEMS.length, Math.floor(state.moneyEarned/MONEY_PER_ISLA)); }
function eur(c){ return ((c||0)/100).toLocaleString('es-ES',{style:'currency',currency:'EUR'}); }
function parseEur(v){ v=(v||'').replace(',','.').trim(); const n=parseFloat(v); return isNaN(n)?0:Math.max(0,Math.round(n*100)); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function driveId(u){ if(!u)return''; const m=String(u).match(/\/d\/([-\w]{20,})/)||String(u).match(/[?&]id=([-\w]{20,})/); return m?m[1]:''; }
function imgSrc(u){ const id=driveId(u); return id?('https://drive.google.com/thumbnail?id='+id+'&sz=w1200'):u; }
function pdfSrc(u){ const id=driveId(u); return id?('https://drive.google.com/file/d/'+id+'/preview'):u; }

/* ---------- router ---------- */
let view={name:'boot'};
function go(name,data={}){ view={name,...data}; render(); window.scrollTo(0,0); }
const app=document.getElementById('app');
function render(){
  switch(view.name){
    case 'setup':return renderSetup();
    case 'loading':return renderLoading();
    case 'error':return renderError();
    case 'home':return renderHome();
    case 'flow':return renderFlow();
    case 'celebrate':return renderCelebrate();
    case 'miDiario':return renderMiDiario();
    case 'learnList':return renderLearnList();
    case 'lesson':return renderLesson();
    case 'quiz':return renderQuiz();
    case 'pin':return renderPin();
    case 'parent':return renderParent();
    case 'emoEdit':return renderEmoEdit();
    case 'lessonEdit':return renderLessonEdit();
  }
}

/* ---------- arranque ---------- */
async function boot(){
  if(!API){ // intenta cache para no dejar en blanco, pero pide configurar
    go('setup'); return;
  }
  go('loading');
  try{
    const s=await api('load'); state=normalize(s);
    await outboxFlush();
    // recarga tras vaciar buzón para incluir lo enviado
    try{ state=normalize(await api('load')); }catch(e){}
    cacheState(); go('home');
  }catch(e){
    try{ const c=localStorage.getItem('isla_cache'); if(c){ state=normalize(JSON.parse(c)); go('home'); toast('Sin conexión: mostrando la última copia'); return; } }catch(e2){}
    go('error');
  }
}
function renderLoading(){ app.innerHTML=`<div class="center-screen"><div class="spinner"></div><p class="note">Cargando tus datos…</p></div>`; }
function renderError(){ app.innerHTML=`<div class="center-screen">
  <div style="font-size:52px">📡</div><h2>No se pudo conectar</h2>
  <p class="note" style="max-width:320px">Revisa que hay internet y que la dirección de la hoja es correcta.</p>
  <div class="row"><button class="btn btn-primary" onclick="boot()">Reintentar</button></div>
  <div class="row" style="margin-top:8px"><button class="btn btn-ghost" onclick="go('setup')">Cambiar dirección</button></div>
</div>`; }

function renderHome(){
  const hora=new Date().getHours();
  const saludo=hora<12?'Buenos días':hora<20?'Buenas tardes':'Buenas noches';
  const nombre=state.nombre?(', '+esc(state.nombre)):'';
  const nLes=state.lessons.length;
  app.innerHTML=topbar()+`
    <div class="greeting"><h1>${saludo}${nombre} 👋</h1><p>¿Qué quieres hacer hoy?</p></div>
    <button class="mode-card mode-1" onclick="startFlow()"><span class="emoji">✍️</span>
      <div><h2>Me ha pasado algo</h2><p>Cuéntalo y descubre qué emoción sentiste. Ganas ${eur(state.rates.registro)}.</p></div></button>
    <button class="mode-card mode-2" onclick="go('learnList')"><span class="emoji">📖</span>
      <div><h2>Aprender emociones</h2><p>${nLes? nLes+' lección'+(nLes>1?'es':'')+' para leer y superar el reto.':'Pronto habrá lecciones aquí.'}</p></div></button>
    <button class="mode-card mode-3" onclick="go('miDiario')"><span class="emoji">📔</span>
      <div><h2>Mi diario</h2><p>Escribe algo importante que te haya pasado.</p></div></button>
    <div class="home-strip">
      <div class="stat"><div class="n">${state.entries.length}</div><div class="l">registros en total</div></div>
      <div class="stat"><div class="n">🔥 ${state.streak}</div><div class="l">días seguidos</div></div>

let draft=null;
function startFlow(){ draft={detonante:'',tags:[],contexto:'',cuerpo:[],emociones:[],intensidad:0}; go('flow',{stepIndex:0}); }
const STEPS=['detonante','contexto','cuerpo','emocion','intensidad'];
function renderFlow(){
  const i=view.stepIndex; const bars=STEPS.map((_,k)=>`<span class="${k<=i?'on':''}"></span>`).join(''); let body='';
  if(STEPS[i]==='detonante'){

      <div class="row"><button class="btn btn-ghost" onclick="go('home')">Salir</button><button class="btn btn-primary" onclick="nextFrom('detonante')">Siguiente</button></div>`;
  } else if(STEPS[i]==='contexto'){
    body=`<h2 class="q">¿Cómo fue?</h2><p class="hint">Dónde estabas, con quién, qué hiciste después. Es opcional.</p>
      <textarea id="f_ctx" rows="4" placeholder="Ej: Estaba en el recreo…">${esc(draft.contexto)}</textarea>
      <div class="row"><button class="btn btn-ghost" onclick="go('flow',{stepIndex:${i-1}})">Atrás</button><button class="btn btn-primary" onclick="nextFrom('contexto')">Siguiente</button></div>`;
  } else if(STEPS[i]==='cuerpo'){
    body=`<h2 class="q">¿Cómo lo notaste en el cuerpo?</h2><p class="hint">Puedes elegir varias.</p>
      <div class="emo-grid">${CUERPO.map(c=>`<button class="emo ${draft.cuerpo.includes(c.id)?'sel':''}" onclick="toggleCuerpo('${c.id}')"><span class="face">${c.face}</span><span class="name">${c.label}</span></button>`).join('')}</div>
      <div class="row"><button class="btn btn-ghost" onclick="go('flow',{stepIndex:${i-1}})">Atrás</button><button class="btn btn-primary" onclick="go('flow',{stepIndex:${i+1}})">Siguiente</button></div>`;
  } else if(STEPS[i]==='emocion'){
    body=`<h2 class="q">¿Qué emoción crees que era?</h2><p class="hint">Elige la que más encaje. Puedes marcar más de una.</p>
      <div class="emo-grid">${emoList().map(e=>`<button class="emo ${draft.emociones.includes(e.id)?'sel':''}" onclick="toggleEmo('${e.id}')"><span class="face">${e.face}</span><span class="name">${esc(e.name)}</span></button>`).join('')}</div>
      <div class="row"><button class="btn btn-ghost" onclick="go('flow',{stepIndex:${i-1}})">Atrás</button><button class="btn btn-primary" ${draft.emociones.length?'':'disabled'} onclick="go('flow',{stepIndex:${i+1}})">Siguiente</button></div>`;
  } else if(STEPS[i]==='intensidad'){
    body=`<h2 class="q">¿Con qué fuerza la sentiste?</h2><p class="hint">Del 1 (muy poquito) al 5 (muchísimo).</p>
      <div class="scale">${[1,2,3,4,5].map(n=>`<button class="${draft.intensidad===n?'sel':''}" onclick="setInt(${n})">${['','🙂','😊','😐','😟','😫'][n]}</button>`).join('')}</div>
      <div class="scale-labels"><span>Muy poco</span><span>Muchísimo</span></div>
      <div class="row"><button class="btn btn-ghost" onclick="go('flow',{stepIndex:${i-1}})">Atrás</button><button class="btn btn-primary" ${draft.intensidad?'':'disabled'} onclick="finishFlow()">Guardar ✓</button></div>`;
  }
  app.innerHTML=topbar()+`<div class="progress">${bars}</div><div class="step">${body}</div>`;
}
function toggleTag(d){ const el=document.getElementById('f_det'); if(el)draft.detonante=el.value; const k=draft.tags.indexOf(d);k>=0?draft.tags.splice(k,1):draft.tags.push(d); renderFlow(); }
function toggleCuerpo(id){ const k=draft.cuerpo.indexOf(id);k>=0?draft.cuerpo.splice(k,1):draft.cuerpo.push(id); renderFlow(); }
function toggleEmo(id){ const k=draft.emociones.indexOf(id);k>=0?draft.emociones.splice(k,1):draft.emociones.push(id); renderFlow(); }
function setInt(n){ draft.intensidad=n; renderFlow(); }
function nextFrom(id){ if(id==='detonante'){const el=document.getElementById('f_det');if(el)draft.detonante=el.value;} if(id==='contexto'){const el=document.getElementById('f_ctx');if(el)draft.contexto=el.value;} go('flow',{stepIndex:view.stepIndex+1}); }
function finishFlow(){
  const entry={id:Date.now(),ts:new Date().toISOString(),detonante:draft.detonante.trim(),tags:[...draft.tags],contexto:draft.contexto.trim(),cuerpo:[...draft.cuerpo],emociones:[...draft.emociones],intensidad:draft.intensidad};
  state.entries.unshift(entry);
  let ganados=state.rates.registro; const tk=todayKey();
  if(state.lastDay!==tk){ const ayer=todayKey(new Date(Date.now()-86400000)); state.streak=(state.lastDay===ayer)?state.streak+1:1; state.lastDay=tk; ganados+=state.rates.racha; }
  const before=unlockedCount(); state.money+=ganados; state.moneyEarned+=ganados; const after=unlockedCount();
  pushRegistro(entry); pushConfig();
  go('celebrate',{ganados,nuevaPieza:after>before?ISLA_ITEMS[after-1]:null,back:'home'});
}

let quizState=null;
function startQuiz(id){ const l=state.lessons.find(x=>x.id===id); const ans={}; (l.questions||[]).forEach((q,qi)=>{ if(q.type==='texto')ans[qi]=''; }); quizState={id,answers:ans,checked:false}; go('quiz',{id}); }
function renderQuiz(){
  const l=state.lessons.find(x=>x.id===view.id); if(!l){go('learnList');return;}
  const qs=l.questions||[];
  const answered=qs.every((q,qi)=> q.type==='texto' ? true : (quizState.answers[qi]!=null));
  app.innerHTML=topbar()+`
    <div class="parent-head"><button class="icon-btn" onclick="go('lesson',{id:'${l.id}'})">←</button><h1 style="font-size:20px">Reto: ${esc(l.title)}</h1></div>
    ${qs.map((q,qi)=>`
      <div class="quiz-q"><div class="qt">${qi+1}. ${esc(q.q)}</div>
        ${q.imgUrl?`<img src="${imgSrc(q.imgUrl)}" alt="">`:''}
        ${q.type==='texto'
          ? `<textarea rows="3" placeholder="Escribe tu respuesta…" ${quizState.checked?'disabled':''} oninput="quizState.answers[${qi}]=this.value">${esc(quizState.answers[qi]||'')}</textarea>`
          : q.opts.map((o,oi)=>{ let cls='opt'; const sel=quizState.answers[qi]===oi; if(quizState.checked){ if(oi===q.correct)cls+=' ok'; else if(sel)cls+=' no'; } else if(sel)cls+=' sel';
              return `<button class="${cls}" ${quizState.checked?'disabled':''} onclick="pickAns(${qi},${oi})">${esc(o)}</button>`; }).join('')}
      </div>`).join('')}
    <div class="row">${quizState.checked?`<button class="btn btn-primary" onclick="go('learnList')">Terminar</button>`:`<button class="btn btn-primary" ${answered?'':'disabled'} onclick="checkQuiz('${l.id}')">Corregir</button>`}</div>`;
}
function pickAns(qi,oi){ quizState.answers[qi]=oi; renderQuiz(); }
function checkQuiz(id){
  const l=state.lessons.find(x=>x.id===id); const qs=l.questions||[];
  let ok=0,totalGraded=0,textAnswered=0; const textAns={};
  qs.forEach((q,qi)=>{ if(q.type==='texto'){ const a=(quizState.answers[qi]||'').trim(); textAns[q.id]={q:q.q,a}; if(a)textAnswered++; } else { totalGraded++; if(quizState.answers[qi]===q.correct)ok++; } });
  quizState.checked=true;
  const prev=state.learnDone[id]||{}; const first=prev.quizBest==null && prev.quizTotal==null;
  state.learnDone[id]={...prev,read:true,quizBest:Math.max(prev.quizBest||0,ok),quizTotal:totalGraded,textAnswers:textAns,lastDone:new Date().toISOString()};
  let ganados=0; if(first){ ganados=(ok+textAnswered)*state.rates.acierto; state.money+=ganados; state.moneyEarned+=ganados; }
  pushConfig(); renderQuiz();
  const msg=totalGraded?`Has acertado ${ok} de ${totalGraded}`:'¡Respondido!';
  setTimeout(()=>toast(`${msg}${ganados?` · +${eur(ganados)}`:''}`),200);
}

function last7(){ const cut=Date.now()-7*86400000; return state.entries.filter(e=>new Date(e.ts).getTime()>=cut); }
function reportHTML(){
  const data=last7();
  if(!data.length) return `<div class="callout">Todavía no hay registros esta semana.</div>`;

function entryHTML(e){

function reportText(){
  const data=last7(); const counts={}; let sumInt=0; data.forEach(e=>{ e.emociones.forEach(id=>counts[id]=(counts[id]||0)+1); sumInt+=e.intensidad; });
  const avg=data.length?(sumInt/data.length).toFixed(1):'0'; const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const now=new Date(),desde=new Date(Date.now()-7*86400000); const m=emoMap();
  let t=`INFORME SEMANAL — ISLA DE LAS EMOCIONES\nNiño/a: ${state.nombre||'—'}\nPeriodo: ${desde.toLocaleDateString('es-ES')} a ${now.toLocaleDateString('es-ES')}\nRegistros: ${data.length} · Intensidad media: ${avg}/5\n\nEMOCIONES MÁS FRECUENTES:\n`;

function copyReport(){ const txt=reportText(); if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Informe copiado ✓')).catch(()=>fallbackCopy(txt)); else fallbackCopy(txt); }
function fallbackCopy(txt){ const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Informe copiado ✓');}catch(e){toast('Selecciona y copia el texto');}document.body.removeChild(ta); }
function downloadReportPDF(){

function addOpt(i){ if(lessonDraft.questions[i].opts.length>=4){toast('Máximo 4 opciones');return;} lessonDraft.questions[i].opts.push(''); drawQuiz(); }
function delOpt(qi,oi){ const q=lessonDraft.questions[qi]; if(q.opts.length<=2){toast('Mínimo 2 opciones');return;} q.opts.splice(oi,1); if(q.correct>=q.opts.length)q.correct=0; drawQuiz(); }
function setCorrect(qi,oi){ lessonDraft.questions[qi].correct=oi; drawQuiz(); }
function drawQuiz(){
  const el=document.getElementById('l_quiz');
  el.innerHTML=lessonDraft.questions.map((q,qi)=>{ const isTxt=q.type==='texto';
    return `<div class="quiz-q">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><span class="badge">${isTxt?'Escribir texto':'Opción múltiple'}</span><span style="flex:1"></span><button class="mini danger" onclick="delQ(${qi})">🗑️</button></div>
      <input type="text" value="${esc(q.q)}" placeholder="Enunciado de la pregunta ${qi+1}" oninput="lessonDraft.questions[${qi}].q=this.value" style="width:100%;margin-bottom:8px">
      <input type="url" value="${esc(q.imgUrl||'')}" placeholder="Enlace de imagen de Drive (opcional)" oninput="lessonDraft.questions[${qi}].imgUrl=this.value" style="width:100%;margin-bottom:8px">
      ${isTxt?`<p class="note" style="margin:0">El niño responderá escribiendo. Verás su respuesta en el panel de familia.</p>`
        : q.opts.map((o,oi)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
            <button class="mini" onclick="setCorrect(${qi},${oi})" style="${q.correct===oi?'border-color:var(--accent);color:var(--accent)':''}">${q.correct===oi?'●':'○'}</button>
            <input type="text" value="${esc(o)}" placeholder="Opción ${oi+1}" oninput="lessonDraft.questions[${qi}].opts[${oi}]=this.value" style="flex:1">
            <button class="mini danger" onclick="delOpt(${qi},${oi})">✕</button></div>`).join('')+`<button class="btn btn-ghost btn-sm" onclick="addOpt(${qi})" style="margin-top:4px">+ Opción</button>`}
    </div>`; }).join('');
}
function saveLesson(){
  lessonDraft.title=(document.getElementById('l_title').value||'').trim();
  lessonDraft.emo=document.getElementById('l_emo').value;
  const txtEl=document.getElementById('l_text'); if(txtEl)lessonDraft.text=txtEl.value;
  const enlEl=document.getElementById('l_enlace'); if(enlEl)lessonDraft.enlace=enlEl.value.trim();
  if(!lessonDraft.title){ toast('Ponle un título'); return; }
  if((lessonDraft.kind==='pdf'||lessonDraft.kind==='imagen') && !lessonDraft.enlace){ toast('Pega el enlace de Drive'); return; }
  lessonDraft.questions=lessonDraft.questions.filter(q=> q.q.trim() && (q.type==='texto' || q.opts.filter(o=>o.trim()).length>=2));
  const cleanQs=lessonDraft.questions.map(q=>{ const cq={id:q.id,type:q.type,q:q.q.trim(),imgUrl:(q.imgUrl||'').trim()};
    if(q.type==='texto'){ cq.opts=[]; cq.correct=0; } else { cq.opts=q.opts.map(o=>o.trim()).filter(o=>o); cq.correct=q.correct>=cq.opts.length?0:q.correct; } return cq; });
  const clean={id:lessonDraft.id,emo:lessonDraft.emo,title:lessonDraft.title,kind:lessonDraft.kind,text:lessonDraft.text||'',enlace:lessonDraft.enlace||'',questions:cleanQs};
  const i=state.lessons.findIndex(l=>l.id===clean.id); if(i>=0)state.lessons[i]=clean; else state.lessons.push(clean);
  pushLecciones(); toast('Lección guardada ✓'); go('parent');
}

/* ---- Ajustes ---- */
function settingsHTML(){
  return `<div class="field"><label for="s_nombre">Nombre del niño/a</label><input type="text" id="s_nombre" value="${esc(state.nombre)}" placeholder="Ej: Marcos"></div>
    <div class="row" style="margin-top:0"><button class="btn btn-primary" onclick="saveName()">Guardar nombre</button></div>
    <div class="field" style="margin-top:22px"><label>Sincronización</label>
      <p class="note">Los datos se guardan en tu hoja de Google y se comparten entre dispositivos. Pulsa para recargar los últimos cambios.</p>
      <div class="row" style="margin-top:0"><button class="btn btn-ghost" onclick="boot()">🔄 Recargar datos</button></div>
      <div class="row" style="margin-top:8px"><button class="btn btn-ghost" onclick="go('setup')">Cambiar dirección de la hoja</button></div></div>
    <div class="field" style="margin-top:18px"><label>PIN de familia</label><div class="row" style="margin-top:0"><button class="btn btn-ghost" onclick="resetPin()">Cambiar PIN</button></div></div>
    <div class="callout" style="margin-top:18px"><b>Versión sincronizada.</b> Registro de emociones, informe (con PDF), dinero/paga, editor de emociones y lecciones con enlaces de Drive. Todo compartido entre dispositivos.</div>
    <div class="row" style="margin-top:14px"><button class="btn btn-ghost" style="color:var(--danger)" onclick="wipeData()">Borrar todos los datos</button></div>`;
}
function saveName(){ state.nombre=document.getElementById('s_nombre').value.trim(); pushConfig(); toast('Guardado ✓'); }
function resetPin(){ state.pin=''; pushConfig(); toast('Crea un PIN nuevo'); go('pin'); }
async function wipeData(){ if(!window._wipeArmed){ window._wipeArmed=true; toast('Pulsa otra vez para confirmar borrado'); setTimeout(()=>window._wipeArmed=false,3000); return; }
  window._wipeArmed=false; try{ await api('reset'); }catch(e){ toast('No se pudo borrar en la hoja'); }
  state=defaultState(); cacheState(); toast('Todo borrado'); parentTab='informe'; go('home'); }

/* recargar al volver a la app (sincroniza entre dispositivos) */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && API && (view.name==='home'||view.name==='learnList'||view.name==='miDiario')){ api('load').then(s=>{ state=normalize(s); cacheState(); if(view.name==='home')renderHome(); else if(view.name==='learnList')renderLearnList(); else if(view.name==='miDiario')renderMiDiario(); }).catch(()=>{}); } });

boot();
</script>
